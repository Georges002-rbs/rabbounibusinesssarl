services:
  - type: web
    name: rabbouni-business-sarl
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /api/jobs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /tmp/storage
    disk:
      name: rabbouni-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
